<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bidding Paddle - Pro Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-pass { background-color: #c62828; font-size: 18px; padding: 10px 20px; margin-top: 10px; }
        .btn-rtm { background-color: #7209b7; font-size: 20px; padding: 15px; color: white; display: none; margin-top: 10px; width: 100%; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .status-bar { display: flex; justify-content: space-around; background: #e3f2fd; padding: 15px; border-radius: 6px; margin: 15px 0; font-weight: bold; }
        .player-identity-block { display: flex; align-items: center; gap: 20px; text-align: left; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        
        /* ENHANCED TRUE HEADSHOT AVATAR CONTAINER */
        .player-avatar { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; border: 3px solid #1a237e; background: #fafafa; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .player-info-text { flex-grow: 1; }
        .stats-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; margin: 15px 0; font-size: 13px; text-align: left; }
        .blur-filter { filter: blur(8px); opacity: 0.15; pointer-events: none; }
        .timer-badge { background: #ffd166; color: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-family: monospace; font-size: 18px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="card">
        <h2>Connect Bidding Paddle</h2>
        <p>Select your squad identity token:</p>
        <select id="team-select" style="width:100%; padding:12px; margin-bottom:20px; font-size:16px;">
            <option value="Mumbai Titans">Mumbai Titans</option>
            <option value="Delhi Capitals">Delhi Capitals</option>
            <option value="Chennai Kings">Chennai Kings</option>
            <option value="Bangalore Stars">Bangalore Stars</option>
        </select>
        <button class="btn" onclick="claimTeamSlot()">Acquire Franchise Paddle Link</button>
        <p id="lobby-error" style="color:red; font-weight:bold; margin-top:10px;"></p>
    </div>

    <!-- MAIN PADDLE ARENA -->
    <div id="paddle-arena" class="card" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 id="my-identity-header" style="margin:0; color:#1a237e;">Franchise Desk</h2>
            <div class="timer-badge" id="paddle-timer">15s</div>
        </div>
        
        <div class="status-bar">
            <div>Purse: <span id="my-wallet" style="color:#2e7d32;">₹50.00 Cr</span></div>
            <div>RTM Cards: <span id="my-rtm-count" style="color:#7209b7;">1</span></div>
            <div>Count: <span id="my-count">0/20</span></div>
        </div>

        <div style="background:#f5f5f5; padding:15px; border-radius:6px; margin-bottom:20px; position:relative; min-height: 240px;">
            <div id="hidden-placeholder-overlay" style="font-weight:bold; color:#777; padding:70px 0; position:absolute; top:0; left:0; width:100%; height:100%; box-sizing:border-box; background:rgba(245,245,245,0.9); z-index:5; border-radius:6px;">
                🔒 LOT HIDDEN BY AUCTIONEER<br><span style="font-size:12px; font-weight:normal;">Waiting for profile reveal...</span>
            </div>

            <div id="profile-details-wrapper">
                <div class="player-identity-block">
                    <!-- GUARANTEED FALLBACK RECONCILES PORTRAITS IMMEDIATELY -->
                    <img id="player-img" class="player-avatar" src="" alt="Player Headshot" onerror="this.src='https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80';">
                    <div class="player-info-text">
                        <h3 id="player-label" style="margin:0; color: #1a237e; font-size: 22px;">Player Name</h3>
                        <p id="player-origin" style="margin: 3px 0; color: #666; font-weight: bold; font-size:14px;"></p>
                    </div>
                </div>
                
                <div class="stats-box" id="stats-view-node">
                    <div><strong>Batting</strong><p id="p-bat">-</p></div>
                    <div><strong>Bowling</strong><p id="p-bowl">-</p></div>
                    <div><strong>Fielding</strong><p id="p-field">-</p></div>
                </div>
            </div>

            <div style="font-size:24px; color:#e65100; font-weight:bold; margin:10px 0;">
                <span id="price-type-label">Base Price:</span> <span id="room-price">₹0.00 Cr</span>
            </div>
            <div id="room-leader" style="font-size:14px; color:#555;">Leader: None</div>
        </div>

        <button class="btn" id="paddle-clicker" onclick="raisePaddle()">RAISE PADDLE</button>
        <button class="btn btn-pass" id="pass-clicker" onclick="submitPass()">PASS ON THIS PLAYER</button>
        
        <button class="btn-rtm" id="rtm-clicker" onclick="executeRtmIntercept()">🃏 EXERCISE RIGHT TO MATCH (RTM)</button>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://ipl-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myTeam = "", currentLotIndex = 0, currentPrice = 0, currentLeader = "", basePrice = 0, isAcceleratedPhase = false, localAudioTriggerValue = 0;

// FIXED VISUAL POOL: Hard-coded directly to clear, unmistakable studio portraits of male athletes
const masterPlayerPool = [
    {id: 0, name: "Virat Sharma", role: "Bat", origin: "Indian", base: 2.00, bat: "810 runs (Avg: 57.2)", bowl: "0 Wkts", field: "12 Catches", photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80"},
    {id: 1, name: "Liam Livingstone", role: "AR", origin: "Overseas", base: 2.00, bat: "510 runs (SR: 172.4)", bowl: "14 Wkts", field: "8 Catches", photo: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80"},
    {id: 2, name: "Jasprit Bumrah", role: "Bowl", origin: "Indian", base: 2.00, bat: "20 runs", bowl: "35 Wkts (Econ: 6.42)", field: "4 Catches", photo: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150&auto=format&fit=crop&q=80"},
    {id: 3, name: "Rashid Khan", role: "Bowl", origin: "Overseas", base: 2.00, bat: "180 runs (SR: 160.2)", bowl: "29 Wkts (Econ: 6.65)", field: "9 Catches", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80"},
    {id: 4, name: "Jos Buttler", role: "WK", origin: "Overseas", base: 2.00, bat: "680 runs (SR: 158.1)", bowl: "0 Wkts", field: "19 Ct / 3 St", photo: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80"},
    {id: 5, name: "Suryakumar Yadav", role: "Bat", origin: "Indian", base: 1.50, bat: "590 runs (SR: 181.2)", bowl: "0 Wkts", field: "11 Catches", photo: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=80"},
    {id: 6, name: "David Warner", role: "Bat", origin: "Overseas", base: 1.50, bat: "510 runs (Avg: 42.5)", bowl: "0 Wkts", field: "8 Catches", photo: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150&auto=format&fit=crop&q=80"},
    {id: 7, name: "Shubman Gill", role: "Bat", origin: "Indian", base: 1.50, bat: "620 runs (Avg: 48.3)", bowl: "0 Wkts", field: "10 Catches", photo: "https://images.unsplash.com/photo-1521119989659-a83eee488004?w=150&auto=format&fit=crop&q=80"},
    {id: 8, name: "Travis Head", role: "Bat", origin: "Overseas", base: 2.00, bat: "570 runs (SR: 192.3)", bowl: "2 Wkts", field: "6 Catches", photo: "https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=150&auto=format&fit=crop&q=80"},
    {id: 9, name: "Yashasvi Jaiswal", role: "Bat", origin: "Indian", base: 1.00, bat: "540 runs (SR: 165.8)", bowl: "0 Wkts", field: "9 Catches", photo: "https://images.unsplash.com/photo-1519345182560-3f2917c472ef?w=150&auto=format&fit=crop&q=80"}
];

for (let i = 10; i < 100; i++) {
    masterPlayerPool.push({
        id: i,
        name: `Player Block #${i+1}`,
        role: i % 4 === 0 ? "Bat" : i % 4 === 1 ? "Bowl" : i % 4 === 2 ? "AR" : "WK",
        origin: i % 3 === 0 ? "Overseas" : "Indian",
        base: i % 5 === 0 ? 1.50 : i % 5 === 2 ? 1.00 : 0.50,
        bat: "320 runs", bowl: "12 Wkts", field: "6 Catches",
        photo: i % 2 === 0 ? "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80" : "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80"
    });
}

function playGavelSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const swoosh = audioCtx.createOscillator(), swooshGain = audioCtx.createGain();
        swoosh.type = 'sine'; swoosh.frequency.setValueAtTime(80, audioCtx.currentTime);
        swoosh.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.12);
        swooshGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        swooshGain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.08);
        swooshGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
        swoosh.connect(swooshGain); swooshGain.connect(audioCtx.destination);
        swoosh.start(); swoosh.stop(audioCtx.currentTime + 0.14);

        const t = audioCtx.currentTime + 0.11;
        const main = audioCtx.createOscillator(), strikeGain = audioCtx.createGain();
        main.type = 'triangle'; main.frequency.setValueAtTime(220, t);
        main.frequency.exponentialRampToValueAtTime(50, t + 0.15);
        strikeGain.gain.setValueAtTime(1.8, t); strikeGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        main.connect(strikeGain); strikeGain.connect(audioCtx.destination);
        main.start(t); main.stop(t + 0.25);
    } catch(e) {}
}

function claimTeamSlot() {
    let chosenTeam = document.getElementById("team-select").value;
    let slotRef = db.ref("auctionState/teams/" + chosenTeam + "/occupied");

    slotRef.transaction((currentValue) => {
        if (currentValue === null) return false; 
        if (currentValue === true) return; 
        return true; 
    }, (error, committed, snapshot) => {
        if (committed && snapshot.val() === true) {
            myTeam = chosenTeam;
            document.getElementById("lobby-screen").style.display = "none";
            document.getElementById("paddle-arena").style.display = "block";
            document.getElementById("my-identity-header").innerText = myTeam.toUpperCase();
            syncPaddleData();
        } else {
            document.getElementById("lobby-error").innerText = `⚠️ Connection Denied: ${chosenTeam} has already been claimed!`;
        }
    });
}

function syncPaddleData() {
    db.ref("auctionState").on("value", (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        currentLotIndex = data.lotIndex; currentPrice = data.currentBid; currentLeader = data.highestBidder;
        isAcceleratedPhase = (data.phase === "accelerated");

        if (data.triggerGavelAudio && data.triggerGavelAudio !== localAudioTriggerValue) {
            localAudioTriggerValue = data.triggerGavelAudio;
            playGavelSound();
        }

        let teamSpecs = data.teams[myTeam];
        document.getElementById("my-wallet").innerText = `₹${teamSpecs.budget.toFixed(2)} Cr`;
        document.getElementById("my-rtm-count").innerText = teamSpecs.rtmLeft;
        document.getElementById("my-count").innerText = `${teamSpecs.count}/20`;
        document.getElementById("paddle-timer").innerText = `${data.timer}s`;

        let activePoolList = masterPlayerPool; 
        if (isAcceleratedPhase) {
            let unsoldIds = data.unsoldTracker && data.unsoldTracker !== "none" ? data.unsoldTracker.split(",").map(Number) : [];
            activePoolList = unsoldIds.map(id => masterPlayerPool.find(p => p.id === id));
        }

        if(currentLotIndex < activePoolList.length) {
            let target = activePoolList[currentLotIndex];
            basePrice = isAcceleratedPhase ? (target.base / 2) : target.base; 
            
            if (data.isRevealed) {
                document.getElementById("hidden-placeholder-overlay").style.display = "none";
                document.getElementById("profile-details-wrapper").classList.remove("blur-filter");
                document.getElementById("player-img").src = target.photo;
                document.getElementById("player-label").innerText = target.name;
                document.getElementById("player-origin").innerText = `${target.role} | ${target.origin} ${isAcceleratedPhase ? '(ACCELERATED)':''}`;
                document.getElementById("p-bat").innerText = target.bat;
                document.getElementById("p-bowl").innerText = target.bowl;
                document.getElementById("p-field").innerText = target.field;
            } else {
                document.getElementById("hidden-placeholder-overlay").style.display = "block";
                document.getElementById("profile-details-wrapper").classList.add("blur-filter");
                document.getElementById("player-img").src = "";
            }

            if (currentPrice === 0) {
                document.getElementById("price-type-label").innerText = "Base Reserve Price:";
                document.getElementById("room-price").innerText = `₹${basePrice.toFixed(2)} Cr`;
                document.getElementById("room-leader").innerText = "Awaiting opening bid...";
            } else {
                document.getElementById("price-type-label").innerText = "Current High Bid:";
                document.getElementById("room-price").innerText = `₹${currentPrice.toFixed(2)} Cr`;
                document.getElementById("room-leader").innerText = `Leader: ${currentLeader}`;
            }

            let increment = (basePrice >= 1.00 && !isAcceleratedPhase) ? 0.25 : 0.10;
            let expectedNextValue = currentPrice === 0 ? basePrice : currentPrice + increment;
            let hasPassed = data.passes && data.passes[myTeam] === true;

            if (data.isFrozen) {
                lockPaddle("🚨 AUCTION FROZEN BY HOST", true);
                document.getElementById("rtm-clicker").style.display = "none";
            } else if (data.rtmState === "active") {
                lockPaddle("🚨 BIDDING LOCKED: RTM IN PROGRESS", true);
                if (currentLeader !== myTeam && teamSpecs.rtmLeft > 0 && teamSpecs.budget >= currentPrice) {
                    document.getElementById("rtm-clicker").style.display = "block";
                    document.getElementById("rtm-clicker").innerText = `🃏 EXERCISE RTM FOR ₹${currentPrice.toFixed(2)} Cr`;
                } else {
                    document.getElementById("rtm-clicker").style.display = "none";
                }
            } else if (data.rtmState === "claimed") {
                lockPaddle(`🃏 RTM OVERRIDE CLAIMED BY ${data.rtmClaimer}!`, true);
                document.getElementById("rtm-clicker").style.display = "none";
            } else {
                document.getElementById("rtm-clicker").style.display = "none";
                if (!data.isRevealed) lockPaddle("HOLDING FOR PROFILE REVEAL...", true);
                else if (hasPassed) lockPaddle("YOU PASSED ON THIS LOT", true);
                else if (teamSpecs.count >= 20) lockPaddle("SQUAD CAPACITY FULL (20/20)", true);
                else if (teamSpecs.budget < expectedNextValue) lockPaddle("INSUFFICIENT BUDGET PURSE", true);
                else if (currentLeader === myTeam) lockPaddle("YOU ARE HIGHEST BIDDER", true);
                else {
                    document.getElementById("paddle-clicker").disabled = false;
                    document.getElementById("paddle-clicker").style.backgroundColor = "#2e7d32";
                    document.getElementById("paddle-clicker").innerText = `RAISE PADDLE TO ₹${expectedNextValue.toFixed(2)} Cr`;
                    document.getElementById("pass-clicker").disabled = false;
                }
            }
        } else {
            lockPaddle(isAcceleratedPhase ? "AUCTION COMPLETED" : "WAITING FOR ACCELERATED ROUND...", true);
            document.getElementById("rtm-clicker").style.display = "none";
        }
    });
}

function lockPaddle(msg, disablePassButton) {
    let btn = document.getElementById("paddle-clicker"); btn.disabled = true; btn.style.backgroundColor = "#ccc"; btn.innerText = msg;
    if (disablePassButton) document.getElementById("pass-clicker").disabled = true;
}

function raisePaddle() {
    let increment = (basePrice >= 1.00 && !isAcceleratedPhase) ? 0.25 : 0.10;
    let expectedNextValue = currentPrice === 0 ? basePrice : currentPrice + increment;
    db.ref("auctionState/passes/" + myTeam).set(false);
    db.ref("auctionState").update({
        currentBid: expectedNextValue, highestBidder: myTeam, timer: 15,
        logMessage: `🔥 <strong>${myTeam}</strong> raised the paddle to ₹${expectedNextValue.toFixed(2)} Cr!`
    });
}

function submitPass() {
    document.getElementById("pass-clicker").disabled = true;
    db.ref("auctionState/passes/" + myTeam).set(true);
    db.ref("auctionState").update({ logMessage: `🏳️ <strong>${myTeam}</strong> chose to pass on this player lot.` });
}

function executeRtmIntercept() {
    document.getElementById("rtm-clicker").style.display = "none";
    db.ref("auctionState").update({
        rtmState: "claimed", rtmClaimer: myTeam,
        logMessage: `🃏 <strong>RTM ALERT!</strong> ${myTeam} exercised their Right to Match at ₹${currentPrice.toFixed(2)} Cr!`
    });
}
</script>
</body>
</html>
