function playGavelSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const swoosh = audioCtx.createOscillator(), swooshGain = audioCtx.createGain();
        swoosh.type = 'sine'; swoosh.frequency.setValueAtTime(90, audioCtx.currentTime);
        swoosh.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        swooshGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        swooshGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.06);
        swooshGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        swoosh.connect(swooshGain); swooshGain.connect(audioCtx.destination);
        swoosh.start(); swoosh.stop(audioCtx.currentTime + 0.12);

        const t = audioCtx.currentTime + 0.1;
        const main = audioCtx.createOscillator(), strikeGain = audioCtx.createGain();
        main.type = 'triangle'; main.frequency.setValueAtTime(240, t);
        main.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        strikeGain.gain.setValueAtTime(2.0, t); strikeGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        main.connect(strikeGain); strikeGain.connect(audioCtx.destination);
        main.start(t); main.stop(t + 0.2);
    } catch(e){}
}

function toggleFreeze() {
    isRoomFrozen = !isRoomFrozen;
    db.ref("auctionState").update({ isFrozen: isRoomFrozen, logMessage: isRoomFrozen ? "🚨 ROOM FROZEN BY HOST" : "▶️ ROOM RESUMED" });
}

function startTimerEngine() {
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        db.ref("auctionState").once("value", (snap) => {
            const data = snap.val();
            if (!data || data.isFrozen || data.rtmState === "active") return;
            let currentSec = data.timer;
            if (currentSec > 0) {
                db.ref("auctionState/timer").set(currentSec - 1);
            } else if (currentSec === 0 && data.highestBidder !== "None" && data.rtmState === "inactive") {
                clearInterval(countdownInterval);
                db.ref("auctionState/rtmState").set("active");
                db.ref("auctionState").update({ timer: 10, logMessage: `⏱️ TIME! Checking RTM rights for final bidder ${data.highestBidder}...` });
                startRtmTimerEngine();
            }
        });
    }, 1000);
}

function startRtmTimerEngine() {
    let rtmInterval = setInterval(() => {
        db.ref("auctionState").once("value", (snap) => {
            const data = snap.val();
            if (!data || data.isFrozen) return;
            let rtmSec = data.timer;
            if (rtmSec > 0) {
                db.ref("auctionState/timer").set(rtmSec - 1);
            } else {
                clearInterval(rtmInterval);
                db.ref("auctionState/rtmState").set("passed");
                db.ref("auctionState").update({ logMessage: "🔒 RTM window expired. Host can hammer the lot." });
            }
        });
    }, 1000);
}

db.ref("auctionState").on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    currentLotIndex = data.lotIndex; currentLiveBid = data.currentBid; currentLiveLeader = data.highestBidder;
    isAcceleratedMode = (data.phase === "accelerated"); isRoomFrozen = data.isFrozen;
    currentUnsoldList = data.unsoldTracker && data.unsoldTracker !== "none" ? data.unsoldTracker.split(",").map(Number) : [];

    document.getElementById("clock-view").innerText = `${data.timer}s`;
    document.getElementById("clock-view").style.color = data.timer <= 5 ? "#e63946" : "#ffd166";
    document.getElementById("freeze-btn").innerText = isRoomFrozen ? "▶️ UNFREEZE" : "🛑 FREEZE";
    document.getElementById("rtm-broadcast-notice").style.display = data.rtmState === "active" ? "block" : "none";

    const board = document.getElementById("teams-board"); board.innerHTML = "";
    for (let team in data.teams) {
        board.innerHTML += `
            <div class="team-card" style="border-top-color: ${data.teams[team].occupied ? '#2a9d8f':'#e63946'}">
                <strong>${team}</strong> (${data.teams[team].occupied ? 'Live':'Empty'})<br>
                Purse: <strong>₹${data.teams[team].budget.toFixed(2)} Cr</strong> | RTMs: ${data.teams[team].rtmLeft}<br>
                Slots: ${data.teams[team].count}/20
            </div>
        `;
    }

    const lb = document.getElementById("leaderboard-view"); lb.innerHTML = "";
    let sortedTeams = Object.keys(data.teams).map(t => ({name: t, ...data.teams[t]})).sort((a,b) => b.power - a.power);
    sortedTeams.forEach((t, index) => {
        lb.innerHTML += `<div style="padding:8px; border-bottom:1px solid #334155; font-size:15px;"><strong>#${index+1} ${t.name}</strong> - Power Rating: <span style="color:#00f5d4">${t.power.toFixed(0)}</span></div>`;
    });

    if (!isAcceleratedMode && currentLotIndex < masterPlayerPool.length) {
        currentLivePlayer = masterPlayerPool[currentLotIndex];
        document.getElementById("p-name").innerText = `LOT #${currentLotIndex + 1}: ${data.isRevealed ? currentLivePlayer.name : '📑 Hidden Draft Entry'}`;
        updateHostButtons(data);
    } else if (isAcceleratedMode && currentLotIndex < currentUnsoldList.length) {
        currentLivePlayer = masterPlayerPool.find(p => p.id === currentUnsoldList[currentLotIndex]);
        document.getElementById("p-name").innerText = `🔁 ACCELERATED LOT #${currentLotIndex + 1}: ${data.isRevealed ? currentLivePlayer.name : '📑 Hidden Unsold Asset'}`;
        updateHostButtons(data);
    } else {
        document.getElementById("p-name").innerText = !isAcceleratedMode ? "MAIN DRAFT ROUND CONCLUDED" : "AUCTION COMPLETED";
        document.getElementById("reveal-btn").disabled = true; document.getElementById("sell-btn").disabled = true; document.getElementById("unsold-btn").disabled = true;
        document.getElementById("acc-btn").style.display = (!isAcceleratedMode && currentUnsoldList.length > 0) ? "block" : "none";
    }

    const logBox = document.getElementById("log"); logBox.innerHTML += "<br>" + data.logMessage; logBox.scrollTop = logBox.scrollHeight;
});

function updateHostButtons(data) {
    document.getElementById("curr-price").innerText = `₹${currentLiveBid.toFixed(2)} Cr`;
    document.getElementById("curr-leader").innerText = currentLiveLeader;
    document.getElementById("reveal-btn").disabled = data.isRevealed || isRoomFrozen;
    document.getElementById("sell-btn").disabled = (currentLiveLeader === "None" || data.rtmState === "active" || isRoomFrozen);
    document.getElementById("unsold-btn").disabled = (!data.isRevealed || currentLiveLeader !== "None" || isRoomFrozen);
}

function revealProfiles() {
    db.ref("auctionState").update({ isRevealed: true, timer: 15, rtmState: "inactive" });
    startTimerEngine();
}

function sellPlayer() {
    if (currentLiveLeader === "None") return;
    playGavelSound();
    db.ref("auctionState").once("value", (snapshot) => {
        let data = snapshot.val();
        let currentTeams = data.teams;
        let buyer = data.rtmState === "claimed" ? data.rtmClaimer : currentLiveLeader;
        
        currentTeams[buyer].budget -= currentLiveBid;
        currentTeams[buyer].count += 1;
        currentTeams[buyer].roles[currentLivePlayer.role] += 1;
        currentTeams[buyer].power += (currentLivePlayer.value * 10); 

        if(data.rtmState === "claimed") currentTeams[buyer].rtmLeft -= 1;

        db.ref("auctionState").update({
            lotIndex: currentLotIndex + 1, currentBid: 0, highestBidder: "None", isRevealed: false, rtmState: "inactive", timer: 15, teams: currentTeams,
            passes: { "Mumbai Titans": false, "Delhi Capitals": false, "Chennai Kings": false, "Bangalore Stars": false },
            logMessage: `🔨 HAMMER DOWN! ${currentLivePlayer.name} sold to <strong>${buyer}</strong> at ₹${currentLiveBid.toFixed(2)} Cr!`,
            triggerGavelAudio: Math.random()
        });
        startTimerEngine();
    });
}

function unsoldPlayer() {
    db.ref("auctionState").once("value", (snapshot) => {
        let data = snapshot.val();
        let tracker = data.unsoldTracker === "none" ? `${currentLivePlayer.id}` : `${data.unsoldTracker},${currentLivePlayer.id}`;
        db.ref("auctionState").update({
            lotIndex: currentLotIndex + 1, currentBid: 0, highestBidder: "None", isRevealed: false, unsoldTracker: tracker, timer: 15,
            passes: { "Mumbai Titans": false, "Delhi Capitals": false, "Chennai Kings": false, "Bangalore Stars": false },
            logMessage: `❌ LOT PASSED UNSOLD: ${currentLivePlayer.name} moved to reserve pool.`
        });
        startTimerEngine();
    });
}

function startAccelerated() {
    document.getElementById("acc-btn").style.display = "none";
    db.ref("auctionState").update({ lotIndex: 0, currentBid: 0, highestBidder: "None", isRevealed: false, phase: "accelerated", rtmState: "inactive", timer: 15 });
    startTimerEngine();
}
</script>
</body>
